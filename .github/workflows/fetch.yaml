name: Fetch Latest Hukamnama
on:
  workflow_dispatch:
  schedule:
    - cron: "0 1 * * *"
    - cron: "30 2 * * *"
    - cron: "30 5 * * *"

jobs:
  fetch-hukamnama:
    runs-on: self-hosted
    permissions:
      contents: write
      packages: read
    env:
      HUSKY: "0"
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Debug trigger
        run: |
          echo "event_name=${{ github.event_name }}"
          echo "schedule=${{ github.event.schedule }}"
          date -u
          date
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "lts/*"
          registry-url: https://npm.pkg.github.com
          scope: "@gurbaninow"
      - run: npm ci
      - name: Fetch Hukamnama
        id: fetch
        run: npm run fetch
      - uses: stefanzweifel/git-auto-commit-action@v7.2.1
        with:
          commit_message: "feat: ${{ steps.fetch.outputs.date }}"
          commit_author: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
